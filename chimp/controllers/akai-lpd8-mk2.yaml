# Akai LPD8 mk2. Chimp reads each program's notes and CCs from the device itself, so
# only the shape is here. Knobs: the factory programs' CCs.
name: Akai LPD8 mk2
match: [LPD8 mk2]
about: Eight pads and eight knobs, in four programs; Chimp reads the programs from the device.
pads:
  columns: 4
  rows: 2
  first: bottom-left
  banks: 4
  word: Program
controls:
  - {name: "Knob {n}", kind: knob, cc: 70-77, channel: 1}
